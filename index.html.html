<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIZIO | Sua marca em todos os lugares</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101010;--bg:#0f0f0f;--card:#232323;--tx:#fff;--mut:#9a9a9a;--ac:#FF5A1F;--ln:#3a3a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#f2f2f2;--mut:#aaa;--ln:#383838}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#f2f2f2;--mut:#aaa;--ln:#383838}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
a{color:inherit}.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{background:#000;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .w{display:flex;align-items:center;gap:18px;height:62px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.14em;font-size:22px;text-decoration:none}.logo i{color:var(--ac);font-style:normal}
nav{display:flex;gap:16px;margin-left:auto;align-items:center;font-size:14px;flex-wrap:wrap}nav a{text-decoration:none;opacity:.85}nav a:hover{opacity:1}
.btn{display:inline-block;border:0;border-radius:999px;padding:11px 22px;font:700 14px Inter,sans-serif;cursor:pointer;background:var(--ac);color:#101010;text-decoration:none}
.btn.o{background:transparent;border:1.5px solid currentColor;color:inherit}.btn.d{background:#101010;color:#fff}.btn.s{padding:7px 14px;font-size:13px}.btn:disabled{opacity:.4;cursor:not-allowed}
.hero{background:radial-gradient(circle at 80% 20%,#5a220a,#101010 60%);color:#fff;padding:90px 0 80px}
.hero h1{font-size:clamp(38px,7vw,76px);line-height:1.02;margin:0 0 18px;font-weight:800;letter-spacing:-.03em;max-width:12ch}
.hero p{max-width:52ch;font-size:18px;opacity:.85;margin:0 0 28px}.hero .btn+.btn{margin-left:10px}
section{padding:56px 0}h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;margin:0 0 8px}.sub{color:var(--mut);margin:0 0 28px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.07);display:flex;flex-direction:column}
.ph{height:170px;background:linear-gradient(135deg,#1c1c1c,#6b2a0d);display:flex;align-items:flex-end;padding:14px;color:var(--ac);font-weight:800;letter-spacing:.1em}
.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{margin:0;font-size:19px}.cb p{margin:0;color:var(--mut);font-size:14px;flex:1}
.tag{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--ac);color:#101010;width:max-content}.tag.g{background:#ddd;color:#333}.tag.r{background:#fbb}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:10px}.steps div{background:var(--card);border-radius:16px;padding:18px;border-left:5px solid var(--ac)}
.dark{background:#101010;color:#fff}.dark .sub{color:#bbb}
footer{background:#101010;color:#ccc;padding:36px 0;font-size:14px}footer .w{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--ln);border-radius:12px;font:inherit;background:var(--card);color:var(--tx)}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.pan{background:var(--card);border-radius:20px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;cursor:pointer;font:600 14px Inter}.chip.on{background:#101010;color:#fff;border-color:#101010}
.bar{display:flex;gap:6px;margin-bottom:20px}.bar span{flex:1;height:6px;border-radius:9px;background:var(--ln)}.bar span.on{background:var(--ac)}
.err{color:#d33;font-size:13px;margin-top:4px}.ok{background:var(--ac);color:#101010;border-radius:14px;padding:14px;font-weight:600}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.kpi{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.kpi div{background:var(--card);border-radius:16px;padding:16px}.kpi b{font-size:30px;display:block}
.two{display:grid;gap:20px;grid-template-columns:1fr 1fr}@media(max-width:700px){.two{grid-template-columns:1fr}.hero{padding:60px 0}}
.tabs{margin:18px 0}#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#101010;color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:9}
.demo{background:#fff3b0;color:#333;text-align:center;font-size:12px;padding:5px}
</style></head><body>

let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
db=db||JSON.parse(JSON.stringify(SEED));for(const k of ['banners','products','pages'])db[k]=db[k]||[];db.txt=db.txt||{};

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const L=id=>db.locs.find(l=>l.id===id);
const nScreens=l=>l.screens.length||l.declared;
const stTag=l=>l.status==='available'?'<span class="tag">Disponível</span>':l.status==='coming_soon'?'<span class="tag g">EM BREVE</span>':'<span class="tag r">Indisponível</span>';

const waBtn=(cls='btn d',txt)=>wa(txt)?`<a class="${cls}" target="_blank" rel="noopener" href="${wa(txt)}">WhatsApp</a>`:'';
let C={step:1,locs:[],fmt:'Vídeo',dur:30,start:'',end:'',sent:false};
let AT='painel',authed=false;

function locCard(l){const av=l.status==='available';
 return `<article class="card ${av?'hl':''}">${l.img?`<div class="ph" ${bg(l.img)}></div>`:''}<div class="cb"><div class="top"><h3>${esc(l.name)}</h3>${stTag(l)}</div>
 <div class="kv"><div><small>Tipo</small><b>${esc(l.type)}</b></div><div><small>Telas</small><b>${nScreens(l)||'a confirmar'}</b></div><div><small>Formatos</small><b>Vídeo e imagem</b></div><div><small>Duração</small><b>7 a 90 dias</b></div></div>
 <div class="stp">${['Escolha','Configure','Orçamento','Exibição'].map((x,i)=>`<span class="${av||i==0?'d':''}" style="--i:${i}"><i></i>${x}</span>`).join('')}</div>
 <div class="row"><a class="btn o s" href="#local-${l.id}">Ver detalhes</a>${av?`<a class="btn s" href="#anunciar" data-pick="${l.id}">Quero anunciar</a>`:''}</div></div></article>`}
const pill=(t,h,pk)=>`<a class="pill" href="${h}" ${pk?`data-pick="${pk}"`:''}><span class="pc">◆</span><b>${t}</b><span class="ch"><i>›</i><i>›</i><i>›</i></span></a>`;
const mapSvg=()=>`<svg viewBox="0 0 400 170" class="map" aria-hidden="true"><path d="M0 40L400 70M0 120L400 90M80 0L120 170M220 0L190 170M310 0L340 170" stroke="#3a4a5a" stroke-width="3" fill="none"/><path class="rt" d="M40 130L120 105L190 120L250 70L310 85L350 50" stroke="#FF5A1F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500"/><circle cx="350" cy="50" r="6" fill="#FF5A1F"/></svg>`;
function home(){const av=db.locs.filter(l=>l.status!=='inactive');
 return `<div class="onb"><div class="w"><div class="dt"><i></i><i></i><i class="on"></i></div><h1>${esc(T("heroT"))}</h1><p>${esc(T("heroP"))}</p>${pill("Quero anunciar","#anunciar")}</div></div>

 <h2>${esc(T("ondeT"))}</h2><p class="sub">${esc(T("ondeP"))}</p><div class="srch"><input id="hs" placeholder="Buscar ponto de mídia" aria-label="Buscar ponto de mídia"><span>⌕</span></div>

 <section class="dark"><div class="w"><h2>${esc(T("benT"))}</h2><p class="sub">Telas digitais em ambientes comerciais e transporte urbano.</p>
 <div class="steps">${['Presença estratégica','Impacto visual','Comunicação digital','Flexibilidade de campanhas'].map(x=>`<div style="background:#1c1c1c">${x}</div>`).join('')}</div></div></section>

 <section><div class="w"><h2>${esc(T("expT"))}</h2><p class="sub">${esc(T("expP"))}</p><div class="grid">${db.locs.filter(l=>l.status==='coming_soon').map(locCard).join('')}</div></div></section>${db.banners.length?`<section><div class="w"><h2>Novidades e promoções</h2>${banner()}</div></section>`:''}`}

let flt={cat:'Todos',av:'Todos',sort:'rec'};
function results(){let r=db.locs.filter(l=>l.status!=='inactive');
 if(flt.cat!=='Todos')r=r.filter(l=>l.cat===flt.cat);
 if(flt.av==='Disponíveis')r=r.filter(l=>l.status==='available');if(flt.av==='Em breve')r=r.filter(l=>l.status==='coming_soon');
 if(flt.sort==='az')r=[...r].sort((a,b)=>a.name.localeCompare(b.name));
 const ch=(k,o)=>o.map(x=>`<button class="chip ${flt[k]===x?'on':''}" data-f="${k}" data-v="${x}">${x}</button>`).join('');
 return `<section><div class="w"><h2>Encontre o lugar ideal para anunciar</h2><p class="sub">Explore os pontos de mídia disponíveis na rede VIZIO.</p>

 <div class="row"><select id="sort" style="width:auto"><option value="rec">Recomendados</option><option value="az" ${flt.sort==='az'?'selected':''}>Nome (A–Z)</option></select><button class="btn o s" id="clr">Limpar filtros</button></div></div>
 <div class="grid">${r.map(locCard).join('')||'<p>Nenhum ponto encontrado. Limpe os filtros.</p>'}</div></div></section>`}

 return `<section><div class="w" style="max-width:640px"><div class="tb"><a class="bk" href="#resultados" aria-label="Voltar">‹</a><b>Detalhes do ponto</b><span></span></div>

function calc(){const d=C.dur;if(!C.locs.length)return null;let t=0;
 for(const id of C.locs){const l=L(id);if(l.daily==null)return null;t+=l.daily*d}
 const pct=d>=90?db.disc[90]:d>=60?db.disc[60]:d>=30?db.disc[30]:0;return t*(1-(pct||0)/100)}
const addD=(s,n)=>{const x=new Date(s+'T12:00');x.setDate(x.getDate()+n-1);return x.toISOString().slice(0,10)};
function conflict(){for(const id of C.locs)for(const b of db.bookings)if(b.loc===id&&C.start<=b.end&&C.end>=b.start)return L(id).name;return null}

function nextStep(){const c=C,e=$('#se');const bad=m=>{e.textContent=m;return};

  if(c.custom){c.end=$('#ed').value;if(!c.end||c.end<c.start)return bad('A data de término deve ser após o início.');c.dur=Math.round((new Date(c.end)-new Date(c.start))/864e5)+1}else c.end=addD(c.start,c.dur);
